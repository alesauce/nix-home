name: ci

on:
  push:
    branches:
      - main
      - refactor/rebuild-with-dendritic-pattern
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  flake: github:${{ github.repository }}/${{ github.sha }}
  nix-conf: |-
    accept-flake-config = true
    always-allow-substitutes = true
    builders-use-substitutes = true
    max-jobs = auto
  ENABLE_SECRETS: "false"

jobs:
  flake-show:
    runs-on: ubuntu-latest
    steps:
      - name: Clear out space for Nix (not on macOS)
        uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
        if: ${{ runner.os != 'macOS'}}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.nix-conf }}
          determinate: false
      - name: nix-flake-show
        run: nix flake show '${{ env.flake }}'
  get-attrs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.get-attrs.outputs.build }}
      eval: ${{ steps.get-attrs.outputs.eval }}
    steps:
      - name: Clear out space for Nix (not on macOS)
        uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
        if: ${{ runner.os != 'macOS'}}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.nix-conf }}
          determinate: false
      - id: install-jq
        run: nix profile install 'nixpkgs#jq'
      - id: get-attrs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function summary() {
            printf '%s\n' "${*}" >> "$GITHUB_STEP_SUMMARY"
          }

          summary "# CI"
          TMP="$(mktemp -d)"

          # nixosConfigurations.<name> -> {name, hostPlatform, attr}
          nix eval --json '${{ env.flake }}#nixosConfigurations' \
            --apply 'builtins.mapAttrs (n: c: c.config.nixpkgs.hostPlatform.system)' \
            | jq -c '
              to_entries
              | map({
                  name: .key,
                  hostPlatform: .value,
                  attr: "nixosConfigurations.\(.key).config.system.build.toplevel"
              })
            ' >"$TMP/nixosHosts.json"

          # darwinConfigurations.<name> -> {name, hostPlatform, attr}
          nix eval --json '${{ env.flake }}#darwinConfigurations' \
            --apply 'builtins.mapAttrs (n: c: c.pkgs.stdenv.hostPlatform.system)' \
            | jq -c '
              to_entries
              | map({
                  name: .key,
                  hostPlatform: .value,
                  attr: "darwinConfigurations.\(.key).system"
              })
            ' >"$TMP/darwinHosts.json"

          # join, then assign a runner (or mark eval-only when no runner fits)
          jq -c -s add "$TMP/nixosHosts.json" "$TMP/darwinHosts.json" | jq -c '
            map(
              if .hostPlatform == "x86_64-linux" then .runsOn="ubuntu-latest"
              elif .hostPlatform == "aarch64-linux" then .runsOn="ubuntu-24.04-arm"
              elif .hostPlatform == "x86_64-darwin" then .runsOn="macos-13"
              elif .hostPlatform == "aarch64-darwin" then .runsOn="macos-latest"
              else .evalOnly=true | .runsOn="ubuntu-latest"
              end
            )
            | map(.evalOnly //= false)
          ' >"$TMP/hostAttrs.json"

          # dev shells
          jq -c '
            unique_by(.hostPlatform)
            | sort_by(.runsOn)
            | map(
                .attr = "devShells.\(.hostPlatform).default.inputDerivation"
                | .name = "devShell-\(.hostPlatform)"
              )
          ' "$TMP/hostAttrs.json" >"$TMP/shellAttrs.json"

          # join shell and host attrs
          jq -c -s add "$TMP/hostAttrs.json" "$TMP/shellAttrs.json" >"$TMP/attrs.json"

          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi

          neovim_changed=false
          if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
            if gh api "repos/${{ github.repository }}/compare/$base...$head" --jq '.files[].filename' \
              | grep -q '^wrappedPrograms/neovim/'; then
              neovim_changed=true
            fi
          else
            neovim_changed=true
          fi

          if [[ "$neovim_changed" == "true" ]]; then
            summary "- 🔍 \`wrappedPrograms/neovim/\` changed — adding full-language-set build leg"
            jq -n -c '[{
              name: "neovim-languages",
              hostPlatform: "x86_64-linux",
              attr: "packages.x86_64-linux.neovim-full",
              runsOn: "ubuntu-latest",
              evalOnly: false
            }]' >"$TMP/neovimFullAttr.json"
            jq -c -s add "$TMP/attrs.json" "$TMP/neovimFullAttr.json" >"$TMP/attrs2.json"
            mv "$TMP/attrs2.json" "$TMP/attrs.json"
          fi

          # warn about eval-only attrs
          read -r -a evalOnlyAttrs < \
            <(jq -c -r 'map(select(.evalOnly) | .name) | @sh' "$TMP/attrs.json" | tr -d \')
          if [[ "${#evalOnlyAttrs[@]}" -ne 0 ]]; then
            printf -v attrs "\`%s\`, " "${evalOnlyAttrs[@]}"
            summary \
              "- ⚠️ The following attributes will only be evaluated: ${attrs%, }"
          fi

          # add all to-build attrs to the summary
          read -r -a buildAttrs < \
            <(jq -c -r 'map(select(.evalOnly | not) | .name) | @sh' "$TMP/attrs.json" | tr -d \')
          if [[ "${#buildAttrs[@]}" -ne 0 ]]; then
            printf -v attrs "\`%s\`, " "${buildAttrs[@]}"
            summary \
              "- ✅ The following attributes will be built: ${attrs%, }"
          fi

          # check for dupes
          duplicate_count="$(jq -r '
            group_by([.name, .attr]) | map(select(length>1)) | length
            ' "$TMP/attrs.json")"
          if [[ "$duplicate_count" -ne 0 ]]; then
            summary \
              "- ‼️ Duplicate entries in \`attrs.json\`: \`$(cat "$TMP/attrs.json")\`"
            exit 1
          fi

          # split build and evalOnly attrs
          jq -c 'map(select(.evalOnly))' <"$TMP/attrs.json" >"$TMP/eval.json"
          jq -c 'map(select(.evalOnly | not))' <"$TMP/attrs.json" >"$TMP/build.json"

          echo "build=$(<"$TMP/build.json")" >>"$GITHUB_OUTPUT"
          echo "eval=$(<"$TMP/eval.json")" >>"$GITHUB_OUTPUT"
  build:
    name: build ${{ matrix.attrs.name }}
    runs-on: ${{ matrix.attrs.runsOn }}
    needs: [flake-show, get-attrs]
    permissions:
      issues: write
    strategy:
      fail-fast: true
      matrix:
        attrs: ${{ fromJson(needs.get-attrs.outputs.build) }}
    env:
      system: ${{ matrix.attrs.hostPlatform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'push' }}
        with:
          lfs: false
          sparse-checkout: .github/scripts
      - name: Clear out space for Nix (not on macOS)
        uses: wimpysworld/nothing-but-nix@baf7355748bb5651f08b839669d6bb39051b2874
        if: ${{ runner.os != 'macOS'}}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: ${{ env.nix-conf }}
          determinate: false
      - name: nix-fast-build
        run: |
          declare -a args=(
            '--no-nom'
            '--skip-cached'
            '--systems=${{ env.system }}'
            '--option' 'accept-flake-config' 'true'
            '--retries=3'
          )
          args+=('--flake=${{ env.flake }}#${{ matrix.attrs.attr }}')
          nix run 'github:Mic92/nix-fast-build' -- "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/nix-fast-build.log"
      - name: Track deprecation warnings
        if: ${{ always() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deprecation --repo '${{ github.repository }}' \
            --color FBCA04 --description 'Nix flake input deprecation warning' \
            2>/dev/null || true
          .github/scripts/track-deprecations.sh \
            "$RUNNER_TEMP/nix-fast-build.log" \
            '${{ matrix.attrs.name }}' \
            '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

  check:
    runs-on: ubuntu-latest
    needs: [flake-show, build]
    if: always()
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: eval
